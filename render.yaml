# Render Blueprint — Web Service (Docker). База данных — внешняя (Neon, бесплатный Postgres).
# Применение: Render Dashboard → Blueprints → подключить репозиторий → Apply.
# Секреты (sync:false) задаются вручную в Dashboard.
#
# Миграции и seed выполняются в entrypoint контейнера (docker/entrypoint.sh) при старте,
# поэтому preDeployCommand не нужен — работает и на тарифе Free.
services:
  - type: web
    name: symphony-mebeli
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free # можно поднять до starter для «всегда включённого» инстанса
    healthCheckPath: /
    envVars:
      # DATABASE_URL — строка подключения из Neon (neon.tech).
      # Используйте ПРЯМОЕ подключение (host БЕЗ суффикса «-pooler»), с ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # ИИ-консультант: провайдер выбирается по наличию ключа (Groq > Gemini > Anthropic).
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: none
      - key: RUNWAY_API_KEY
        sync: false
      # ИИ-визуализация: curated (курированные рендеры) | higgsfield (живая генерация).
      - key: VISUALIZATION_PROVIDER
        value: curated
      - key: HIGGSFIELD_KEY_ID
        sync: false
      - key: HIGGSFIELD_KEY_SECRET
        sync: false
      # Яндекс.Карты — карта на «Контактах» и виджет отзывов на «Отзывах».
      - key: NEXT_PUBLIC_YANDEX_ORG_ID
        sync: false
      - key: NEXT_PUBLIC_YANDEX_MAP_SRC
        sync: false
