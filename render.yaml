# Render Blueprint — Web Service (Docker) + Managed Postgres.
# Применение: Render Dashboard → Blueprints → подключить репозиторий → Apply.
# Секреты (sync:false) задаются вручную в Dashboard после создания сервиса.
services:
  - type: web
    name: symphony-mebeli
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /
    # Миграции применяются до запуска нового релиза.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: symphony-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: VIDEO_PROVIDER
        value: none
      - key: RUNWAY_API_KEY
        sync: false

databases:
  - name: symphony-db
    plan: basic-256mb
    postgresMajorVersion: "16"
